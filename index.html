<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doki or Furry - Galaxy</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #03030b;
            font-family: 'Outfit', sans-serif;
        }

        #galaxy-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            pointer-events: none; /* Để chuột có thể tương tác xuyên qua thẻ card với canvas sao bên dưới */
        }

        .card {
            pointer-events: auto;
            position: relative;
            background: rgba(15, 15, 30, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(137, 180, 250, 0.25);
            border-radius: 24px;
            padding: 40px 30px;
            width: 100%;
            max-width: 440px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(137, 180, 250, 0.15);
            animation: floatCard 6s ease-in-out infinite;
        }

        @keyframes floatCard {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .card::before, .card::after {
            content: '';
            position: absolute;
            width: 12px;
            height: 12px;
            border: 2px solid #89b4fa;
        }
        .card::before { top: 12px; left: 12px; border-right: none; border-bottom: none; }
        .card::after { bottom: 12px; right: 12px; border-left: none; border-top: none; }

        .avatar-wrapper {
            position: absolute;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: linear-gradient(135deg, #89b4fa, #cba6f7);
            padding: 3px;
            box-shadow: 0 0 25px rgba(203, 166, 247, 0.5);
        }

        .avatar-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            background: #11111b;
        }

        .content {
            margin-top: 40px;
        }

        h1 {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 30%, #cba6f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        p {
            color: #bac2de;
            font-size: 15px;
            margin-bottom: 30px;
            font-weight: 400;
        }

        .join-btn {
            display: inline-block;
            width: 100%;
            padding: 14px 24px;
            background: linear-gradient(135deg, #89b4fa 0%, #cba6f7 100%);
            color: #11111b;
            font-weight: 600;
            font-size: 16px;
            text-decoration: none;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(203, 166, 247, 0.35);
            transition: all 0.3s ease;
            cursor: pointer;
        }

            background: linear-
