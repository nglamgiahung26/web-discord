<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doki or Furry - Galaxy</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #03030b;
            font-family: 'Outfit', sans-serif;
        }

        #galaxy-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            pointer-events: none;
        }

        .card {
            pointer-events: auto;
            position: relative;
            background: rgba(15, 15, 30, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(137, 180, 250, 0.25);
            border-radius: 24px;
            padding: 40px 30px;
            width: 100%;
            max-width: 440px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(137, 180, 250, 0.15);
            animation: floatCard 6s ease-in-out infinite;
        }

        @keyframes floatCard {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .card::before, .card::after {
            content: '';
            position: absolute;
            width: 12px;
            height: 12px;
            border: 2px solid #89b4fa;
        }
        .card::before { top: 12px; left: 12px; border-right: none; border-bottom: none; }
        .card::after { bottom: 12px; right: 12px; border-left: none; border-top: none; }

        .avatar-wrapper {
            position: absolute;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: linear-gradient(135deg, #89b4fa, #cba6f7);
            padding: 3px;
            box-shadow: 0 0 25px rgba(203, 166, 247, 0.5);
        }

        .avatar-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            background: #11111b;
        }

        .content {
            margin-top: 40px;
        }

        h1 {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 30%, #cba6f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        p {
            color: #bac2de;
            font-size: 15px;
            margin-bottom: 30px;
            font-weight: 400;
        }

        .join-btn {
            display: inline-block;
            width: 100%;
            padding: 14px 24px;
            background: linear-gradient(135deg, #89b4fa 0%, #cba6f7 100%);
            color: #11111b;
            font-weight: 600;
            font-size: 16px;
            text-decoration: none;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(203, 166, 247, 0.35);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .join-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(203, 166, 247, 0.6);
            background: linear-gradient(135deg, #cba6f7 0%, #89b4fa 100%);
        }
    </style>
</head>
<body>

    <canvas id="galaxy-canvas"></canvas>

    <div class="container">
        <div class="card">
            <div class="avatar-wrapper">
                <img src="avatar.jpg" alt="Avatar">
            </div>
            <div class="content">
                <h1>Doki or Furry</h1>
                <p>group Gaming</p>
                <a href="https://discord.gg/exAPya3pk8" target="_blank" rel="noopener noreferrer" class="join-btn">THAM GIA</a>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('galaxy-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let mouse = { x: -1000, y: -1000, active: false };
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            mouse.active = true;
        });
        window.addEventListener('mouseleave', () => {
            mouse.active = false;
            mouse.x = -1000;
            mouse.y = -1000;
        });

        const starsCount = 250;
        let stars = [];
        for (let i = 0; i < starsCount; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                vx: (Math.random() - 0.5) * 0.3,
                vy: (Math.random() - 0.5) * 0.3,
                radius: Math.random() * 1.8 + 0.5,
                baseAlpha: Math.random() * 0.7 + 0.3,
                color: Math.random() > 0.3 ? '#ffffff' : (Math.random() > 0.5 ? '#89b4fa' : '#cba6f7')
            });
        }

        let shootingStars = [];
        function createShootingStar() {
            shootingStars.push({
                x: Math.random() * canvas.width,
                y: 0,
                length: Math.random() * 60 + 40,
                speed: Math.random() * 12 + 10,
                angle: Math.PI / 4 + (Math.random() - 0.5) * 0.2,
                alpha: 1
            });
        }

        setInterval(() => {
            if (Math.random() < 0.7) {
                createShootingStar();
            }
        }, 1200);

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let s of stars) {
                s.x += s.vx;
                s.y += s.vy;

                if (s.x < 0) s.x = canvas.width;
                if (s.x > canvas.width) s.x = 0;
                if (s.y < 0) s.y = canvas.height;
                if (s.y > canvas.height) s.y = 0;

                if (mouse.active) {
                    let dx = mouse.x - s.x;
                    let dy = mouse.y - s.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);
                    let pullRadius = 150;

                    if (dist < pullRadius && dist > 5) {
                        let force = (1 - dist / pullRadius) * 2.5;
                        s.x += (dx / dist) * force;
                        s.y += (dy / dist) * force;
                    }
                }

                ctx.beginPath();
                ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                ctx.fillStyle = s.color;
                ctx.globalAlpha = s.baseAlpha;
                ctx.shadowBlur = s.radius > 1.5 ? 8 : 0;
                ctx.shadowColor = s.color;
                ctx.fill();
            }
            ctx.shadowBlur = 0;

            for (let i = shootingStars.length - 1; i >= 0; i--) {
                let ss = shootingStars[i];
                ss.x += Math.cos(ss.angle) * ss.speed;
                ss.y += Math.sin(ss.angle) * ss.speed;
                ss.alpha -= 0.015;

                if (ss.alpha <= 0 || ss.x > canvas.width || ss.y > canvas.height) {
                    shootingStars.splice(i, 1);
                    continue;
                }

                let tailX = ss.x - Math.cos(ss.angle) * ss.length;
                let tailY = ss.y - Math.sin(ss.angle) * ss.length;

                let grad = ctx.createLinearGradient(ss.x, ss.y, tailX, tailY);
                grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
                grad.addColorStop(0.3, 'rgba(137, 180, 250, 0.6)');
                grad.addColorStop(1, 'rgba(137, 180, 250, 0)');

                ctx.beginPath();
                ctx.moveTo(ss.x, ss.y);
                ctx.lineTo(tailX, tailY);
                ctx.strokeStyle = grad;
                ctx.lineWidth = 1.8;
                ctx.globalAlpha = ss.alpha;
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(ss.x, ss.y, 1.5, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#ffffff';
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            ctx.globalAlpha = 1.0;
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
